<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Right and left lateral radiographic projections</title>
  <desc id="desc">Two axial patient diagrams show the beam traveling from left to right for a right lateral projection and from right to left for a left lateral projection. The side named in the projection is closest to the detector.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#f39b29"/></marker></defs>
  <rect width="1200" height="520" rx="34" fill="#f7fbfd"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(40 40)">
      <rect width="540" height="440" rx="26" fill="#fff" stroke="#cfe2eb" stroke-width="3"/>
      <text x="34" y="55" font-size="26" font-weight="700" fill="#087ca8">RIGHT LATERAL</text>
      <text x="34" y="88" font-size="18" fill="#5d6e77">Right side is closest to the detector</text>
      <g transform="translate(80 135)">
        <circle cx="190" cy="105" r="92" fill="#dff3fa" stroke="#087ca8" stroke-width="5"/>
        <path d="M155 54c23-19 54-17 72 4 21 25 20 72-4 98-18 19-50 24-75 4-24-19-31-77 7-106Z" fill="#fff" stroke="#7bbbd2" stroke-width="4"/>
        <text x="105" y="112" text-anchor="middle" font-size="24" font-weight="700" fill="#087ca8">L</text>
        <text x="275" y="112" text-anchor="middle" font-size="24" font-weight="700" fill="#087ca8">R</text>
        <path d="M-35 105H300" stroke="#f39b29" stroke-width="10" marker-end="url(#arrow)"/>
        <text x="-25" y="75" font-size="16" font-weight="700" fill="#9a5300">ENTERS LEFT</text>
        <rect x="315" y="5" width="24" height="200" rx="12" fill="#07141a"/>
        <text x="355" y="105" transform="rotate(90 355 105)" text-anchor="middle" font-size="15" fill="#5d6e77">DETECTOR · RIGHT SIDE</text>
        <text x="190" y="245" text-anchor="middle" font-size="17" fill="#5d6e77">Beam exits the right side</text>
      </g>
    </g>
    <g transform="translate(620 40)">
      <rect width="540" height="440" rx="26" fill="#fff" stroke="#cfe2eb" stroke-width="3"/>
      <text x="34" y="55" font-size="26" font-weight="700" fill="#087ca8">LEFT LATERAL</text>
      <text x="34" y="88" font-size="18" fill="#5d6e77">Left side is closest to the detector</text>
      <g transform="translate(115 135)">
        <circle cx="190" cy="105" r="92" fill="#fff1dc" stroke="#f39b29" stroke-width="5"/>
        <path d="M155 54c23-19 54-17 72 4 21 25 20 72-4 98-18 19-50 24-75 4-24-19-31-77 7-106Z" fill="#fff" stroke="#e6b36b" stroke-width="4"/>
        <text x="105" y="112" text-anchor="middle" font-size="24" font-weight="700" fill="#087ca8">L</text>
        <text x="275" y="112" text-anchor="middle" font-size="24" font-weight="700" fill="#087ca8">R</text>
        <path d="M415 105H80" stroke="#f39b29" stroke-width="10" marker-end="url(#arrow)"/>
        <text x="310" y="75" font-size="16" font-weight="700" fill="#9a5300">ENTERS RIGHT</text>
        <rect x="41" y="5" width="24" height="200" rx="12" fill="#07141a"/>
        <text x="15" y="105" transform="rotate(-90 15 105)" text-anchor="middle" font-size="15" fill="#5d6e77">DETECTOR · LEFT SIDE</text>
        <text x="190" y="245" text-anchor="middle" font-size="17" fill="#5d6e77">Beam exits the left side</text>
      </g>
    </g>
  </g>
</svg>
