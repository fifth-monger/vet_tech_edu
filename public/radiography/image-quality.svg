<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Radiograph image-quality terminology</title>
  <desc id="desc">Four image panels compare a straight projection, patient rotation, motion artifact, and overly wide collimation.</desc>
  <rect width="1200" height="440" rx="34" fill="#f7fbfd"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(30 35)"><rect width="270" height="370" rx="24" fill="#fff" stroke="#cfe2eb" stroke-width="3"/><text x="24" y="48" font-size="21" font-weight="700" fill="#087ca8">STRAIGHT</text><rect x="38" y="78" width="194" height="220" rx="14" fill="#17262d"/><path d="M135 105v160M95 135h80M105 255l30-70 30 70" stroke="#e9f4f8" stroke-width="13" stroke-linecap="round"/><text x="24" y="338" font-size="16" fill="#5d6e77">Symmetric positioning</text></g>
    <g transform="translate(320 35)"><rect width="270" height="370" rx="24" fill="#fff" stroke="#cfe2eb" stroke-width="3"/><text x="24" y="48" font-size="21" font-weight="700" fill="#087ca8">ROTATION</text><rect x="38" y="78" width="194" height="220" rx="14" fill="#17262d"/><g transform="rotate(15 135 188)"><path d="M135 105v160M95 135h80M105 255l30-70 30 70" stroke="#e9f4f8" stroke-width="13" stroke-linecap="round"/></g><text x="24" y="338" font-size="16" fill="#5d6e77">Unintended asymmetry</text></g>
    <g transform="translate(610 35)"><rect width="270" height="370" rx="24" fill="#fff" stroke="#cfe2eb" stroke-width="3"/><text x="24" y="48" font-size="21" font-weight="700" fill="#087ca8">MOTION</text><rect x="38" y="78" width="194" height="220" rx="14" fill="#17262d"/><path d="M125 105v160M85 135h80M95 255l30-70 30 70M145 105v160M105 135h80M115 255l30-70 30 70" stroke="#e9f4f8" stroke-opacity=".48" stroke-width="12" stroke-linecap="round"/><text x="24" y="338" font-size="16" fill="#5d6e77">Blur or doubled edges</text></g>
    <g transform="translate(900 35)"><rect width="270" height="370" rx="24" fill="#fff" stroke="#cfe2eb" stroke-width="3"/><text x="24" y="48" font-size="21" font-weight="700" fill="#087ca8">WIDE FIELD</text><rect x="24" y="70" width="222" height="236" rx="14" fill="#17262d"/><rect x="76" y="105" width="118" height="166" rx="8" fill="none" stroke="#f39b29" stroke-width="4" stroke-dasharray="10 8"/><path d="M135 125v125M105 155h60" stroke="#e9f4f8" stroke-width="11" stroke-linecap="round"/><text x="24" y="338" font-size="16" fill="#5d6e77">Collimate to the area needed</text></g>
  </g>
</svg>
