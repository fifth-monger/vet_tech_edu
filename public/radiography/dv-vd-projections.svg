<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Dorsoventral and ventrodorsal radiographic projections</title>
  <desc id="desc">Two diagrams show a dog in sternal recumbency for a dorsoventral projection and in dorsal recumbency for a ventrodorsal projection. Orange arrows show the x-ray beam entering the named first surface and exiting toward the detector.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#f39b29"/></marker></defs>
  <rect width="1200" height="560" rx="34" fill="#f7fbfd"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(35 35)">
      <rect width="550" height="490" rx="26" fill="#fff" stroke="#cfe2eb" stroke-width="3"/>
      <text x="35" y="55" font-size="26" font-weight="700" fill="#087ca8">DV · DORSOVENTRAL</text>
      <text x="35" y="88" font-size="18" fill="#5d6e77">Dog in sternal recumbency · chest down</text>
      <g transform="translate(130 145)">
        <text x="145" y="0" text-anchor="middle" font-size="17" font-weight="700" fill="#087ca8">DORSAL SURFACE</text>
        <path d="M55 105c25-58 78-82 145-74 69 8 105 44 113 84 7 36-19 70-61 79-60 13-153 8-188-21-22-18-25-42-9-68Z" fill="#dff3fa" stroke="#087ca8" stroke-width="4"/>
        <circle cx="328" cy="102" r="43" fill="#dff3fa" stroke="#087ca8" stroke-width="4"/>
        <path d="M360 92l44-20-31 38M74 123l-45 22" fill="none" stroke="#087ca8" stroke-width="10" stroke-linecap="round"/>
        <path d="M120 190v34m110-33v33" stroke="#087ca8" stroke-width="14" stroke-linecap="round"/>
        <text x="145" y="260" text-anchor="middle" font-size="17" font-weight="700" fill="#5d6e77">VENTRAL SURFACE · DETECTOR SIDE</text>
        <rect x="20" y="280" width="360" height="24" rx="12" fill="#07141a"/>
        <text x="200" y="335" text-anchor="middle" font-size="16" fill="#5d6e77">DETECTOR</text>
        <path d="M200-55V62" stroke="#f39b29" stroke-width="10" marker-end="url(#arrow)"/>
        <text x="216" y="-25" font-size="16" font-weight="700" fill="#9a5300">BEAM ENTERS DORSAL</text>
      </g>
    </g>
    <g transform="translate(615 35)">
      <rect width="550" height="490" rx="26" fill="#fff" stroke="#cfe2eb" stroke-width="3"/>
      <text x="35" y="55" font-size="26" font-weight="700" fill="#087ca8">VD · VENTRODORSAL</text>
      <text x="35" y="88" font-size="18" fill="#5d6e77">Dog in dorsal recumbency · back down</text>
      <g transform="translate(130 145)">
        <text x="145" y="0" text-anchor="middle" font-size="17" font-weight="700" fill="#087ca8">VENTRAL SURFACE</text>
        <path d="M55 105c25-58 78-82 145-74 69 8 105 44 113 84 7 36-19 70-61 79-60 13-153 8-188-21-22-18-25-42-9-68Z" fill="#fff1dc" stroke="#f39b29" stroke-width="4"/>
        <circle cx="328" cy="102" r="43" fill="#fff1dc" stroke="#f39b29" stroke-width="4"/>
        <path d="M360 92l44-20-31 38M74 123l-45 22" fill="none" stroke="#f39b29" stroke-width="10" stroke-linecap="round"/>
        <path d="M120 45V10m110 36V11" stroke="#f39b29" stroke-width="14" stroke-linecap="round"/>
        <text x="145" y="260" text-anchor="middle" font-size="17" font-weight="700" fill="#5d6e77">DORSAL SURFACE · DETECTOR SIDE</text>
        <rect x="20" y="280" width="360" height="24" rx="12" fill="#07141a"/>
        <text x="200" y="335" text-anchor="middle" font-size="16" fill="#5d6e77">DETECTOR</text>
        <path d="M200-55V62" stroke="#f39b29" stroke-width="10" marker-end="url(#arrow)"/>
        <text x="216" y="-25" font-size="16" font-weight="700" fill="#9a5300">BEAM ENTERS VENTRAL</text>
      </g>
    </g>
  </g>
</svg>
